<!-- BILLING INFORMATION -->
<h3>Billing Information</h3>

<label class="mt-sm" for="fullname">Full Name</label>
<input id="fullname" name="fullname" type="text" autocomplete="name"
       class="w-100 mt-xs p-sm border rounded">

<label class="mt-sm" for="email">Email Address</label>
<input id="email" name="email" type="email" autocomplete="email"
       class="w-100 mt-xs p-sm border rounded">

<label class="mt-sm" for="phone">Phone Number</label>
<input id="phone" name="phone" type="tel" autocomplete="tel"
       class="w-100 mt-xs p-sm border rounded">

<label class="mt-sm" for="address">Address</label>
<input id="address" name="address" type="text" autocomplete="street-address"
       class="w-100 mt-xs p-sm border rounded">

<label class="mt-sm" for="city">City</label>
<input id="city" name="city" type="text" autocomplete="address-level2"
       class="w-100 mt-xs p-sm border rounded">

<label class="mt-sm" for="state">State</label>
<input id="state" name="state" type="text" autocomplete="address-level1"
       class="w-100 mt-xs p-sm border rounded">

<label class="mt-sm" for="zip">Zip Code</label>
<input id="zip" name="zip" type="text" autocomplete="postal-code"
       class="w-100 mt-xs p-sm border rounded">


<!-- PAYMENT DETAILS -->
<h3 class="mt-lg">Payment Details</h3>

<label class="mt-sm" for="cardnumber">Card Number</label>
<input id="cardnumber" name="cardnumber" type="text" inputmode="numeric"
       autocomplete="cc-number"
       class="w-100 mt-xs p-sm border rounded">

<label class="mt-sm" for="exp">Expiration Date</label>
<input id="exp" name="exp" type="text" autocomplete="cc-exp"
       placeholder="MM/YY"
       class="w-100 mt-xs p-sm border rounded">

<label class="mt-sm" for="cvv">CVV</label>
<input id="cvv" name="cvv" type="text" inputmode="numeric"
       autocomplete="cc-csc"
       class="w-100 mt-xs p-sm border rounded">

<a href="07-confirmation.html" class="btn w-100 mt-lg">Complete Order</a>
